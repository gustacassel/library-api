spring.application.name=libraryapi
server.port=8080

# Datasource - somente livros, emprestimos e auditoria; os estudantes vivem
# no banco do microsservico students-api
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console web do H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Spring Cloud - integracao com o microsservico students-api
# ---------------------------------------------------------------------------
students-api.url=http://localhost:8081

spring.cloud.openfeign.client.config.students-api.connect-timeout=2000
spring.cloud.openfeign.client.config.students-api.read-timeout=3000
spring.cloud.openfeign.client.config.default.logger-level=basic

# Desligado de proposito: o circuit breaker automatico do Feign envolveria as
# excecoes em NoFallbackAvailableException e o StudentGateway nao conseguiria
# mais distinguir um 404 de uma falha de comunicacao. O circuito e aplicado
# uma unica vez, no StudentGateway.
spring.cloud.openfeign.circuitbreaker.enabled=false

# Depois de 50% de falhas em 10 chamadas o circuito abre por 10s.
resilience4j.circuitbreaker.instances.students-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.students-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.students-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.students-api.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.students-api.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.students-api.timeout-duration=4s
